<!-- @dsCard group="Colors" viewport="700x120" name="Chart palette" subtitle="Assign --chart-1 … --chart-5 in order. Never introduce a colour outside this set." -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.lbl{font-size:11px;color:var(--text-muted);letter-spacing:.02em}.lbl b{display:block;color:var(--text-title);font-size:12px;font-weight:600;letter-spacing:-.01em}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--chart-1)"></div><div class="lbl"><b>chart-1</b></div></div><div class="sw"><div class="chip" style="background:var(--chart-2)"></div><div class="lbl"><b>chart-2</b></div></div><div class="sw"><div class="chip" style="background:var(--chart-3)"></div><div class="lbl"><b>chart-3</b></div></div><div class="sw"><div class="chip" style="background:var(--chart-4)"></div><div class="lbl"><b>chart-4</b></div></div><div class="sw"><div class="chip" style="background:var(--chart-5)"></div><div class="lbl"><b>chart-5</b></div></div><div class="sw"><div class="chip" style="background:var(--chart-track)"></div><div class="lbl"><b>chart-track</b></div></div></div></body></html>
