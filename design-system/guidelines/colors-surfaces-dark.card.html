<!doctype html><html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.lbl{font-size:11px;color:var(--text-muted);letter-spacing:.02em}.lbl b{display:block;color:var(--text-title);font-size:12px;font-weight:600;letter-spacing:-.01em}</style></head><body><div class="row" style="align-items:stretch">
<div class="sw"><div style="height:78px;border-radius:var(--radius-lg);background:#070D0F;border:1px solid var(--border-subtle)"></div><div class="lbl"><b>page</b>#070D0F</div></div><div class="sw"><div style="height:78px;border-radius:var(--radius-lg);background:#0E1618;border:1px solid var(--border-subtle)"></div><div class="lbl"><b>card</b>#0E1618</div></div><div class="sw"><div style="height:78px;border-radius:var(--radius-lg);background:#162023;border:1px solid var(--border-subtle)"></div><div class="lbl"><b>raised</b>#162023</div></div><div class="sw"><div style="height:78px;border-radius:var(--radius-lg);background:#1E2A2D;border:1px solid var(--border-subtle)"></div><div class="lbl"><b>inset</b>#1E2A2D</div></div><div class="sw"><div style="height:78px;border-radius:var(--radius-lg);background:#23D3D3;border:1px solid var(--border-subtle)"></div><div class="lbl"><b>accent</b>#23D3D3</div></div>
</div></body></html>
