<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--ink-300);font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.lbl{font-size:11px;color:var(--text-muted);letter-spacing:.02em}.lbl b{display:block;color:var(--text-title);font-size:12px;font-weight:600;letter-spacing:-.01em}</style></head><body><div class="row" style="align-items:stretch">

</div></body></html>
