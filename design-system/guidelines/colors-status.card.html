<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.col{display:flex;flex-direction:column;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.chip{height:56px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.lbl{font-size:11px;color:var(--text-muted);letter-spacing:.02em}.lbl b{display:block;color:var(--text-title);font-size:12px;font-weight:600;letter-spacing:-.01em}</style></head><body><div class="row">
<div class="sw"><div style="height:64px;border-radius:var(--radius-md);background:var(--success-soft);color:var(--success);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px">Entregue</div><div class="lbl"><b>--success</b>--success-soft</div></div><div class="sw"><div style="height:64px;border-radius:var(--radius-md);background:var(--warning-soft);color:var(--warning);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px">Aguardando</div><div class="lbl"><b>--warning</b>--warning-soft</div></div><div class="sw"><div style="height:64px;border-radius:var(--radius-md);background:var(--danger-soft);color:var(--danger);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px">Retido</div><div class="lbl"><b>--danger</b>--danger-soft</div></div><div class="sw"><div style="height:64px;border-radius:var(--radius-md);background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px">Em trânsito</div><div class="lbl"><b>--accent</b>--accent-soft</div></div>
</div></body></html>
