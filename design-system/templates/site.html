<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Impoclick · Importação em um clique</title>
<link rel="icon" type="image/png" href="../assets/logo-impoclick.png">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../patterns/patterns.css">
</head>
<body>
<div id="root"></div>
<script type="module">
  import { mountSite } from './site.js';
  if (new URLSearchParams(location.search).get('tema') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  mountSite(document.getElementById('root'), { onEnter: () => location.assign('painel.html') });
</script>
</body>
</html>
