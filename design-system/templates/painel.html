<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Impoclick · Painel do importador</title>
<link rel="icon" type="image/png" href="../assets/logo-impoclick.png">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../patterns/patterns.css">
<style>html,body,#root{height:100%}</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import { mountPainel } from './painel.js';
  const params = new URLSearchParams(location.search);
  mountPainel(document.getElementById('root'), {
    route: params.get('rota') || undefined,
    theme: params.get('tema') === 'dark' ? 'dark' : 'light',
  });
</script>
</body>
</html>
