<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Impoclick</title>
    <link rel="stylesheet" href="ds-tokens.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body class="impoclick-page">
    <div class="header">
        <img src="icons/icon48.png" alt="" width="20" height="20">
        <span class="brand">Impoclick</span>
    </div>

    <!-- Vista inicial: sem ela o formulário de login pisca a cada abertura,
         mesmo com o usuário já logado, até refresh() responder. -->
    <div id="view-loading" class="view">
        <p class="hint" style="margin:0;">Carregando...</p>
    </div>

    <div id="view-login" class="view hidden">
        <p class="hint" style="margin:0 0 0.7rem;">Entre com a mesma conta que você usa no site.</p>
        <form id="form-login">
            <label for="email">E-mail</label>
            <input type="email" id="email" required autocomplete="username">
            <label for="password">Senha</label>
            <input type="password" id="password" required autocomplete="current-password">
            <button type="submit" class="btn">Entrar</button>
            <p id="login-error" class="error hidden"></p>
        </form>
    </div>

    <div id="view-session" class="view hidden">
        <p class="user-name" id="user-name"></p>

        <!-- Sessão expirada é uma falha só, com conserto: sem esta faixa, as
             quatro linhas abaixo diziam "erro" e não havia o que fazer. -->
        <div id="sessao-aviso" class="sessao-aviso hidden">
            <span id="sessao-aviso-texto"></span>
            <button type="button" id="btn-reentrar">Entrar de novo</button>
        </div>

        <!-- As quatro linhas abaixo leem dados da conta do Mercado Livre
             conectada — sem este rótulo, o popup não deixava claro de onde
             vinham as informações. -->
        <p class="rotulo-secao">Sua conta no Mercado Livre</p>

        <!-- Cada área vira UMA linha clicável: o nome diz o assunto, o
             indicador à direita diz se há algo para ver. Antes eram quatro
             blocos de "frase + botão largo", que repetiam a mesma estrutura e
             gastavam o dobro do espaço. -->
        <nav class="rows">
            <a class="row" id="reviews-link" href="https://www.impoclick.com.br/#view-reviews" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                <span class="row-nome">Avaliações</span>
                <span class="row-estado" id="reviews-count"></span>
            </a>

            <a class="row" id="catalog-link" href="https://www.impoclick.com.br/#view-catalog/losing" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="6"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
                <span class="row-nome">Catálogo</span>
                <span class="row-estado" id="catalog-count"></span>
            </a>

            <a class="row" id="promotions-link" href="https://www.impoclick.com.br/#view-promotions/active" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
                <span class="row-nome">Promoções</span>
                <span class="row-estado" id="promotions-count"></span>
            </a>

            <a class="row" id="ads-link" href="https://www.impoclick.com.br/#view-ads" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="3 11 3 13 6 13 11 18 11 6 6 11 3 11"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                <span class="row-nome">Patrocinados</span>
                <span class="row-estado" id="ads-count"></span>
            </a>
        </nav>

        <!-- Abrir o side panel exige gesto do usuário, e o popup é onde ele
             está clicando. Fica desabilitado fora do Mercado Livre, onde o
             painel não teria anúncio nenhum para ler. -->
        <button id="btn-painel" class="btn btn-painel">Abrir painel na lateral</button>
        <p id="painel-erro" class="error hidden"></p>

        <!-- Atalhos de promoção: só aparecem quando há contagem em algum
             deles. Antes eram três chips fixos que quebravam a linha mesmo
             sem nada para mostrar. -->
        <div id="promo-atalhos" class="atalhos hidden">
            <a href="https://www.impoclick.com.br/#view-promotions/soon" target="_blank" rel="noopener">Vencem em 10 dias</a>
            <a href="https://www.impoclick.com.br/#view-promotions/ended" target="_blank" rel="noopener">Sem promoção</a>
            <a href="https://www.impoclick.com.br/#view-promotions/lightning" target="_blank" rel="noopener">Podem ter Relâmpago</a>
        </div>

        <p class="hint">Abra um anúncio no Mercado Livre e o painel de viabilidade aparece na página.</p>

        <button id="btn-logout" class="link-sair">Sair</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
