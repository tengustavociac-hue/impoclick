name: Checar avaliações da Shopee

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de checagem
        run: |
          curl -sf -X POST "https://www.impoclick.com.br/api/ml-reviews?provider=shopee" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
