name: Checar avaliações do Mercado Livre

on:
  schedule:
    - cron: '*/15 * * * *'
  # A janela pode ser escolhida à mão. Sem isso, disparos manuais dentro dos
  # mesmos 15 minutos repetem sempre a mesma fatia de anúncios — não dava para
  # forçar uma varredura completa quando algum dado precisava ser corrigido já.
  workflow_dispatch:
    inputs:
      offset:
        description: 'Janela de anúncios a varrer (0, 100, 200...). Vazio = rodízio normal.'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de checagem
        run: |
          URL="https://www.impoclick.com.br/api/ml-reviews"
          if [ -n "${{ github.event.inputs.offset }}" ]; then
            URL="$URL?offset=${{ github.event.inputs.offset }}"
          fi
          curl -sf -X POST "$URL" -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
