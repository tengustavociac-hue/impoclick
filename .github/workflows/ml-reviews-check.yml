name: Checar avaliações do Mercado Livre

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de checagem
        run: |
          curl -sf -X POST https://www.impoclick.com.br/api/ml-reviews \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
